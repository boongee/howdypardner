<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Howdy Pardner Pinball</title>
  <style>
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111827; }
    .iframe-wrapper { position: relative; width: 100%; height: 100%; overflow: hidden; }
    
    /* We make the iframe taller than the screen, and pull it up 30px to hide the banner */
    iframe {
      position: absolute;
      top: -5px; 
      left: 0;
      width: 100%;
      height: calc(100% + 30px); 
      border: none;
    }
  </style>
</head>
<body>
  <div class="iframe-wrapper">
    <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScLkJkYjldakZ-IZExxMTvRGAz7u7LvMbM3Ys48XwFNm8vHbg/viewform"></iframe>
  </div>
</body>
</html>
